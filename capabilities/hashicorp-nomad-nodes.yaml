  description: 'HashiCorp Nomad HTTP API — Nodes. 7 operations. Lead operation: Read node. Self-contained Naftiko capability
    covering one Hashicorp Nomad business surface.'
  tags:
  - Hashicorp Nomad
  - Nodes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
