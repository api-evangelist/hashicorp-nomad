naftiko: 1.0.0-alpha2
info:
  label: HashiCorp Nomad HTTP API — Namespaces
  description: 'HashiCorp Nomad HTTP API — Namespaces. 4 operations. Lead operation: Read namespace. Self-contained Naftiko
    capability covering one Hashicorp Nomad business surface.'
  tags:
  - Hashicorp Nomad
  - Namespaces
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HASHICORP_NOMAD_API_KEY: HASHICORP_NOMAD_API_KEY
capability:
  consumes:
  - type: http
    namespace: hashicorp-nomad-namespaces
    baseUri: http://127.0.0.1:4646/v1
    description: HashiCorp Nomad HTTP API — Namespaces business capability. Self-contained, no shared references.
    resources:
    - name: namespace-name
      path: /namespace/{name}
      operations:
      - name: get
        method: GET
        description: Read namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Create or update namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete
        method: DELETE
        description: Delete namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: namespaces
      path: /namespaces
      operations:
      - name: get
        method: GET
        description: List namespaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.HASHICORP_NOMAD_API_KEY}}'
  exposes:
  - type: rest
    namespace: hashicorp-nomad-namespaces-rest
    port: 8080
    description: REST adapter for HashiCorp Nomad HTTP API — Namespaces. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/namespace/{name}
      name: namespace-name
      description: REST surface for namespace-name.
      operations:
      - method: GET
        name: get
        description: Read namespace
        call: hashicorp-nomad-namespaces.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Create or update namespace
        call: hashicorp-nomad-namespaces.post
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete
        description: Delete namespace
        call: hashicorp-nomad-namespaces.delete
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/namespaces
      name: namespaces
      description: REST surface for namespaces.
      operations:
      - method: GET
        name: get
        description: List namespaces
        call: hashicorp-nomad-namespaces.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: hashicorp-nomad-namespaces-mcp
    port: 9090
    transport: http
    description: MCP adapter for HashiCorp Nomad HTTP API — Namespaces. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: read-namespace
      description: Read namespace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hashicorp-nomad-namespaces.get
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-namespace
      description: Create or update namespace
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: hashicorp-nomad-namespaces.post
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-namespace
      description: Delete namespace
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: hashicorp-nomad-namespaces.delete
      outputParameters:
      - type: object
        mapping: $.
    - name: list-namespaces
      description: List namespaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: hashicorp-nomad-namespaces.get
      outputParameters:
      - type: object
        mapping: $.
